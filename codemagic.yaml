workflows:
  ios-workflow:
    name: Potty Mouth iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20.11.0
      xcode: 15.4
      cocoapods: default
    scripts:
      - name: Set up Node
        script: |
          npm install
      - name: Install dependencies
        script: |
          npm ci || npm install
      - name: Build web assets
        script: |
          npm run build || npx ionic build || npx vite build || echo "No build script, using www"
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
          npx cap copy ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install && cd ../..
      - name: Set encryption flag
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist
      - name: Build iOS
        script: |
          xcodebuild -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" -configuration Release -sdk iphoneos -archivePath $CM_BUILD_DIR/App.xcarchive archive CODE_SIGNING_ALLOWED=NO
    artifacts:
      - $CM_BUILD_DIR/App.xcarchive
    publishing:
      app_store_connect:
        auth: integration
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_app_store: false
        
