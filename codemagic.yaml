workflows:
  ios-workflow:
    name: Potty Mouth
    instance_type: mac_mini_m2
    environment:
      groups: [appstore]
      vars:
        BUNDLE_ID: com.paulkelly.pottymouthsongwriter
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22.12.0
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Build App
        script: |
          npm ci || npm install
          echo '{"appId":"com.paulkelly.pottymouthsongwriter","appName":"Potty Mouth","webDir":"www"}' > capacitor.config.json
          if [ -f index.html ] && [ ! -d www ]; then mkdir -p www; cp index.html www/; fi
          npm run build || true
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      - name: Code Signing
        script: |
          keychain initialize
          echo "=== CREATE BUNDLE ID ==="
          app-store-connect create-bundle-id $BUNDLE_ID PottyMouth --key-id $APP_STORE_CONNECT_KEY_IDENTIFIER --issuer-id $APP_STORE_CONNECT_ISSUER_ID --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY || echo "bundle exists"
          echo "=== FETCH SIGNING FILES ==="
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create --key-id $APP_STORE_CONNECT_KEY_IDENTIFIER --issuer-id $APP_STORE_CONNECT_ISSUER_ID --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY
          echo "=== LIST FILES ==="
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "no profiles folder"
          ls -lh $HOME/Library/MobileDevice/Certificates/ || echo "no certs folder"
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
