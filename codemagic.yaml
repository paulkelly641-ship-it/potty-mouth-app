workflows:
  ios-workflow:
    name: Potty Mouth iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.paulkelly.pottymouthsongwriter"
      node: 20.11.0
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install --save @capacitor/core @capacitor/cli @capacitor/ios || true
          npm install || true

      - name: Prepare www folder
        script: |
          if [ ! -d "www" ] && [ -f "index.html" ]; then
            echo "Creating www from root"
            mkdir -p www
            cp index.html www/index.html 2>/dev/null || true
            cp -r *.js www/ 2>/dev/null || true
            cp -r *.css www/ 2>/dev/null || true
          fi
          ls -la www/ || echo "no www"

      - name: Add iOS platform
        script: |
          npx @capacitor/cli add ios || true
          npx @capacitor/cli sync ios || true
          npx @capacitor/cli copy ios || true

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update || pod install
          cd ../..

      - name: Set encryption flag
        script: |
          INFO_PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$INFO_PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$INFO_PLIST" || true

      - name: Build unsigned IPA for App Store
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME" ||           xcodebuild -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" -configuration Release -sdk iphoneos -archivePath $CM_BUILD_DIR/App.xcarchive archive CODE_SIGNING_ALLOWED=NO || true
          ls -la build/ios/ipa/ || ls -la $CM_BUILD_DIR/ || true

    artifacts:
      - build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
      
