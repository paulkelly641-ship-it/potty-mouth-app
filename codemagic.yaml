workflows:
  ios-workflow:
    name: Potty Mouth iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.paulkelly.pottymouthsongwriter"
      node: 20.11.0
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install

      - name: Build web assets
        script: |
          if [ -f "index.html" ] && [ ! -d "www" ]; then mkdir -p www; cp index.html www/; fi
          npm run build || echo "using www"

      - name: Add iOS platform
        script: |
          npx cap add ios || true
          npx cap sync ios
          npx cap copy ios

      - name: Install CocoaPods
        script: |
          cd ios/App && pod install --repo-update && cd ../..

      - name: Set encryption flag
        script: |
          INFO_PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$INFO_PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$INFO_PLIST"

      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create || echo "fetch signing failed, will try unsigned"
          keychain add-certificates || true
          xcode-project use-profiles || true

      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME" || xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME" --disable-xcpretty

    artifacts:
      - build/ios/ipa/*.ipa
      
