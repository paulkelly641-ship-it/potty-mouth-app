workflows:
  ios-workflow:
    name: Potty Mouth iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.paulkelly.pottymouthsongwriter"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22.12.0
      xcode: 16.2
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install

      - name: Build web assets
        script: |
          if [ -f "index.html" ] && [ ! -d "www" ]; then mkdir -p www; cp index.html www/; fi
          npm run build || true
          ls -la www

      - name: Add iOS platform
        script: |
          rm -rf ios
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap add ios || true
          if [ ! -f "capacitor.config.json" ]; then echo '{ "appId": "com.paulkelly.pottymouthsongwriter", "appName": "Potty Mouth", "webDir": "www" }' > capacitor.config.json; fi
          npx cap sync ios || true
          npx cap copy ios || true
          ls -la ios/App/App.xcodeproj || true

      - name: Set encryption flag and bundle ID manually
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "ios/App/App/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "ios/App/App/Info.plist"
          echo "Setting bundle id to $BUNDLE_ID"
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/" ios/App/App.xcodeproj/project.pbxproj || true
          sed -i '' "s/com.getcapacitor.myapp/$BUNDLE_ID/g" ios/App/App.xcodeproj/project.pbxproj || true
          sed -i '' "s/io.ionic.starter/$BUNDLE_ID/g" ios/App/App.xcodeproj/project.pbxproj || true

      - name: Save API key - FIXED PEM
        script: |
          echo "Key ID: $APP_STORE_CONNECT_KEY_IDENTIFIER"
          echo "Issuer ID: $APP_STORE_CONNECT_ISSUER_ID"
          # Fix escaped \n issue - Codemagic sometimes stores literal \n
          mkdir -p /tmp
          printf "%s" "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/raw.p8
          # Convert literal \n to real newline if needed
          if grep -q "\\n" /tmp/raw.p8; then
            echo "Fixing escaped newlines..."
            sed 's/\\n/\n/g' /tmp/raw.p8 | sed 's/\n/
/g' > /tmp/AuthKey.p8
            # Second pass with printf %b
            printf "%b" "$(cat /tmp/raw.p8)" > /tmp/AuthKey.p8 2>/dev/null || true
          else
            cp /tmp/raw.p8 /tmp/AuthKey.p8
          fi
          echo "Key size: $(wc -c < /tmp/AuthKey.p8) bytes"
          head -1 /tmp/AuthKey.p8
          tail -1 /tmp/AuthKey.p8
          if ! grep -q "BEGIN PRIVATE KEY" /tmp/AuthKey.p8; then
            echo "ERROR: Key is not PEM format! Content:"
            cat /tmp/AuthKey.p8
            exit 1
          fi
          echo "✅ Valid PEM"

      - name: Set up code signing
        script: |
          set -x
          keychain initialize
          # Create bundle id if needed
          app-store-connect create-bundle-id $BUNDLE_ID "Potty Mouth" --key-id $APP_STORE_CONNECT_KEY_IDENTIFIER --issuer-id $APP_STORE_CONNECT_ISSUER_ID --private-key @/tmp/AuthKey.p8 || echo "Bundle ID exists or create failed, continuing..."
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create --key-id $APP_STORE_CONNECT_KEY_IDENTIFIER --issuer-id $APP_STORE_CONNECT_ISSUER_ID --private-key @/tmp/AuthKey.p8
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Build IPA
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
        
