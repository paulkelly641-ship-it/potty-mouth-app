workflows:
  ios-workflow:
    name: Potty Mouth iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.paulkelly.pottymouthsongwriter"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_CONNECT_KEY_ID: "4J7TXK56C9"
        APP_STORE_CONNECT_ISSUER: "822ddf42-0c9d-41a6-bdea-066fe770ce07"
      node: 22.12.0
      xcode: 16.2
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install

      - name: Build web assets
        script: |
          if [ -f "index.html" ] && [ ! -d "www" ]; then mkdir -p www; cp index.html www/; fi
          npm run build || true

      - name: Add iOS platform
        script: |
          rm -rf ios
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap add ios || true
          if [ ! -f "capacitor.config.json" ]; then echo '{ "appId": "com.paulkelly.pottymouthsongwriter", "appName": "Potty Mouth", "webDir": "www" }' > capacitor.config.json; fi
          npx cap sync ios || true
          npx cap copy ios || true

      - name: Set encryption flag and bundle ID manually
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "ios/App/App/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "ios/App/App/Info.plist"
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/" ios/App/App.xcodeproj/project.pbxproj || true

      - name: Save API key - FINAL FIX
        script: |
          # Use hardcoded IDs as fallback if env var empty
          KEY_ID=${APP_STORE_CONNECT_KEY_IDENTIFIER:-$APP_STORE_CONNECT_KEY_ID}
          if [ -z "$KEY_ID" ] || [ "$KEY_ID" = "" ]; then KEY_ID="4J7TXK56C9"; fi
          ISSUER_ID=${APP_STORE_CONNECT_ISSUER_ID:-$APP_STORE_CONNECT_ISSUER}
          if [ -z "$ISSUER_ID" ]; then ISSUER_ID="822ddf42-0c9d-41a6-bdea-066fe770ce07"; fi
          echo "Using Key ID: $KEY_ID"
          echo "Using Issuer ID: $ISSUER_ID"
          # Save for next steps
          echo "KEY_ID=$KEY_ID" > /tmp/ids.env
          echo "ISSUER_ID=$ISSUER_ID" >> /tmp/ids.env
          python3 << 'PYEOF'
          import os
          key = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY','')
          if '\\n' in key:
              key = key.replace('\\n', '\n')
          key = key.replace('\r','').strip()
          if not key.startswith('-----BEGIN'):
              idx = key.find('-----BEGIN')
              if idx>=0:
                  key=key[idx:]
          with open('/tmp/AuthKey.p8','w') as f:
              f.write(key)
              if not key.endswith('\n'):
                  f.write('\n')
          print(f"Wrote key {len(key)} chars")
          PYEOF
          ls -lh /tmp/AuthKey.p8
          head -1 /tmp/AuthKey.p8
          openssl pkcs8 -in /tmp/AuthKey.p8 -inform PEM -nocrypt -check 2>&1 | head -2 || true
          echo "✅ Valid PEM ready"

      - name: Set up code signing
        script: |
          set -e
          source /tmp/ids.env
          echo "Using Key ID: $KEY_ID"
          echo "Using Issuer ID: $ISSUER_ID"
          keychain initialize
          app-store-connect create-bundle-id $BUNDLE_ID "Potty Mouth" --key-id $KEY_ID --issuer-id $ISSUER_ID --private-key @/tmp/AuthKey.p8 || echo "Bundle ID exists, continuing..."
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create --key-id $KEY_ID --issuer-id $ISSUER_ID --private-key @/tmp/AuthKey.p8
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Build IPA
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
        
