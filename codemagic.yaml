workflows:
  ios-workflow:
    name: Potty Mouth iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      vars:
        BUNDLE_ID: "com.paulkelly.pottymouthsongwriter"
      node: 22.12.0
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install

      - name: Build web assets
        script: |
          if [ -f "index.html" ] && [ ! -d "www" ]; then mkdir -p www; cp index.html www/; fi
          npm run build || true
          ls -la www

      - name: Add iOS platform
        script: |
          rm -rf ios
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap add ios
          npx cap copy ios
          ls -la ios/App/

      - name: Set encryption flag
        script: |
          INFO_PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$INFO_PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$INFO_PLIST"

      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create || echo "unsigned build"
          keychain add-certificates || true
          xcode-project use-profiles || true

      - name: Build IPA
        script: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            echo "Building with workspace"
            xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
          else
            echo "Building with project (no pods)"
            xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      
