workflows:
  ios-workflow:
    name: Potty Mouth iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.paulkelly.pottymouthsongwriter"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22.12.0
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install
      - name: Build web assets
        script: |
          if [ -f "index.html" ] && [ ! -d "www" ]; then mkdir -p www; cp index.html www/; fi
          npm run build || true
      - name: Add iOS platform and FIX Bundle ID
        script: |
          rm -rf ios
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap add ios
          echo "=== Fix bundle ID BEFORE sync ==="
          sed -i '' "s/com.yourname.pottymouth/$BUNDLE_ID/g" ios/App/App.xcodeproj/project.pbxproj 2>/dev/null || sed -i "s/com.yourname.pottymouth/$BUNDLE_ID/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/io.ionic.starter/$BUNDLE_ID/g" ios/App/App.xcodeproj/project.pbxproj 2>/dev/null || sed -i "s/io.ionic.starter/$BUNDLE_ID/g" ios/App/App.xcodeproj/project.pbxproj
          npx cap sync ios
          echo "=== Fix bundle ID AFTER sync (cap sync overwrites!) ==="
          sed -i '' "s/com.yourname.pottymouth/$BUNDLE_ID/g" ios/App/App.xcodeproj/project.pbxproj 2>/dev/null || sed -i "s/com.yourname.pottymouth/$BUNDLE_ID/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/io.ionic.starter/$BUNDLE_ID/g" ios/App/App.xcodeproj/project.pbxproj 2>/dev/null || sed -i "s/io.ionic.starter/$BUNDLE_ID/g" ios/App/App.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "ios/App/App/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $BUNDLE_ID" "ios/App/App/Info.plist"
          grep "PRODUCT_BUNDLE_IDENTIFIER" ios/App/App.xcodeproj/project.pbxproj | head -3
          echo "Info.plist bundle:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "ios/App/App/Info.plist" || true
      - name: Set encryption flag
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "ios/App/App/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "ios/App/App/Info.plist"
      - name: Save API key
        script: |
          mkdir -p /tmp
          python3 -c "
          import os
          data = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY','')
          data = data.replace('\\n','\n')
          open('/tmp/AuthKey.p8','w').write(data.strip()+'\n')
          print('Key fixed')
          "
      - name: Set up code signing - MANUAL
        script: |
          set -x
          keychain initialize
          app-store-connect create-bundle-id $BUNDLE_ID "Potty Mouth" --key-id $APP_STORE_CONNECT_KEY_IDENTIFIER --issuer-id $APP_STORE_CONNECT_ISSUER_ID --private-key @/tmp/AuthKey.p8 || echo "bundle exists ok"
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create --key-id $APP_STORE_CONNECT_KEY_IDENTIFIER --issuer-id $APP_STORE_CONNECT_ISSUER_ID --private-key @/tmp/AuthKey.p8
          keychain add-certificates
          echo "=== PROFILES INSTALLED ==="
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "=== Profile names ==="
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do echo "$f"; grep -a -A1 "Name" "$f" | head -5 || true; done
          # DO NOT use use-profiles, we will manually set signing
          echo "=== Manual signing setup done ==="
      - name: Build IPA - MANUAL SIGNING
        script: |
          set -x
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          echo "Using profile: $PROFILE_PATH"
          PROFILE_UUID=$(grep -a -A1 "UUID" "$PROFILE_PATH" | tail -n 1 | sed -E 's/.*<string>(.*)<\/string>/\1/' || basename "$PROFILE_PATH" .mobileprovision)
          echo "Profile UUID: $PROFILE_UUID"
          PROFILE_NAME=$(grep -a "<key>Name</key>" -A1 "$PROFILE_PATH" | tail -n 1 | sed -E 's/.*<string>(.*)<\/string>/\1/' || echo "Potty Mouth Profile")
          echo "Profile Name: $PROFILE_NAME"
          # Try build with automatic signing but with profiles present
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" --verbose || echo "First method failed, trying xcodebuild manual"
          if [ ! -d "build/ios/ipa" ]; then
            echo "=== Trying manual xcodebuild ==="
            xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -archivePath build/ios/xcarchive/App.xcarchive archive CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" DEVELOPMENT_TEAM="" ||             xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -archivePath build/ios/xcarchive/App.xcarchive archive CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE="$PROFILE_UUID"
            mkdir -p build/ios/ipa
            cat > /tmp/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF
            xcodebuild -exportArchive -archivePath build/ios/xcarchive/App.xcarchive -exportPath build/ios/ipa -exportOptionsPlist /tmp/ExportOptions.plist ||             xcodebuild -exportArchive -archivePath build/ios/xcarchive/App.xcarchive -exportPath build/ios/ipa -exportOptionsPlist /tmp/ExportOptions.plist --allowProvisioningUpdates
            ls -lh build/ios/ipa/
          fi
          ls -lh build/ios/ipa/ || true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
        
